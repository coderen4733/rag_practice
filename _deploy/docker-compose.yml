#  * 개발용 임베딩 서버(CPU) 실행 설정
#  - Ollama 컨테이너에 bge-m3 임베딩 모델을 올려서 CPU로 실행
#
# 📌 사용법 (_deploy 폴더에서 실행, Docker Desktop이 켜져 있어야 함)
#  - 켜기      : docker compose up -d embedding
#  - 상태 확인 : docker compose ps          (STATUS가 healthy면 준비 완료)
#  - 로그 보기 : docker compose logs -f embedding
#  - 끄기      : docker compose down        (다운로드한 모델은 볼륨에 남아 있음)
#  - 처음 켤 때 bge-m3 모델(약 1.2GB)을 내려받으므로 몇 분 걸릴 수 있음
#
# 📌 왜 Docker로 띄우는가?
#  - 맥의 Docker 컨테이너는 GPU를 사용할 수 없어서 자동으로 CPU로만 실행됨
#    => 맥북 GPU는 LLM(Ollama 일반 앱, 포트 11434)이 전부 사용할 수 있음
#  - 나중에 폐쇄망 납품 시에도 이 "CPU 임베딩 컨테이너"를 그대로 가져갈 수 있음
#
# 📌 백엔드 .env 설정: EMBEDDING_BASE_URL=http://localhost:8081/v1

services:
  # 임베딩 서버 (Ollama + bge-m3, CPU 전용)
  embedding:
    # ⚠️ latest: 항상 최신 버전 사용 (납품용으로는 버전을 고정해야 함, 예: ollama/ollama:0.x.x)
    image: ollama/ollama:latest
    container_name: rag-embedding
    # 컴퓨터를 재시작하거나 컨테이너가 죽어도 자동으로 다시 켜짐 (직접 끈 경우는 제외)
    restart: unless-stopped
    ports:
      # "내 컴퓨터 포트:컨테이너 포트"
      #  - 컨테이너 안의 Ollama는 11434 포트를 사용
      #  - 맥에 설치한 Ollama 앱(LLM용)도 11434를 쓰므로, 겹치지 않게 8081로 연결
      - "8081:11434"
    environment:
      # 컨테이너 밖(내 컴퓨터)에서 접속할 수 있도록 모든 주소에서 요청을 받음
      OLLAMA_HOST: "0.0.0.0:11434"
      # 모델을 메모리에서 내리지 않고 계속 올려둠 (-1: 무제한)
      #  => 오랫동안 요청이 없다가 다시 요청할 때 모델을 다시 불러오는 대기 시간이 없음
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      # 다운로드한 모델 파일을 볼륨에 저장 => 컨테이너를 지웠다 다시 만들어도 재다운로드 불필요
      - embedding_models:/root/.ollama
    # 컨테이너 시작 시 실행할 명령
    #  1) Ollama 서버를 백그라운드(&)로 실행
    #  2) 서버가 응답할 때까지 1초마다 확인하며 대기
    #  3) bge-m3 모델 다운로드 (이미 있으면 바로 넘어감)
    #  4) wait: 백그라운드로 실행한 Ollama 서버가 끝날 때까지 컨테이너를 유지
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        until ollama list > /dev/null 2>&1; do sleep 1; done
        ollama pull bge-m3
        wait
    # 상태 확인: bge-m3 모델이 준비되면 healthy로 표시됨 (docker compose ps 로 확인)
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q bge-m3"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 10s
    # 최대 메모리 사용량 제한 (bge-m3 실행에 약 2GB 필요, 여유를 두고 4GB)
    #  - Docker Desktop > Settings > Resources 의 메모리가 이보다 커야 함 (6GB 이상 권장)
    deploy:
      resources:
        limits:
          memory: 4g

# 이름 있는 볼륨: Docker가 관리하는 저장 공간 (모델 파일 보관용)
volumes:
  embedding_models:
