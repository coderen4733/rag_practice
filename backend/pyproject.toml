[project]
name = "backend"
version = "0.1.0"
authors = [
    { name = "CDR4733", email = "shsing2@naver.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "celery[redis]>=5.6.3",
    #  * python-jose가 설치해 주던 cryptography를 직접 설치하도록 추가
    #  - src/core/security.py의 Scrypt(비밀번호 해시)가 cryptography를 사용함
    #    (파일 위치 변경: 기존 src/common/security.py -> 변경 src/core/security.py)
    #  - 기존에는 python-jose[cryptography]를 통해 "간접적으로" 설치되고 있었기 때문에,
    #    python-jose를 제거하면서 직접 명시하지 않으면 비밀번호 해시 코드가 깨짐
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "greenlet>=3.5.6",  # SQLAlchemy 비동기(async) 기능이 내부적으로 사용하는 라이브러리
    "httpx>=0.28.1",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.5",
    # pydantic -> pydantic[email]
    #  - 스키마에서 사용하는 EmailStr 타입은 email-validator 패키지가 있어야 동작함
    #  - [email]을 붙이면 email-validator가 함께 설치됨 (없으면 서버 시작 시 ImportError 발생)
    "pydantic[email]>=2.13.5",
    "pydantic-settings>=2.15.0",
    #  * python-jose[cryptography] -> pyjwt
    #  - python-jose는 유지보수가 거의 중단되었고 보안 취약점(CVE) 이력이 있음
    #  - FastAPI 공식 문서도 JWT 처리 라이브러리를 PyJWT로 변경함
    "pyjwt>=2.15.0",
    "qdrant-client>=1.19.1",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
    #  * python-multipart
    #  - FastAPI가 "파일 업로드(multipart/form-data)" 요청을 읽으려면 이 패키지가 필요함
    #    (문서 등록 API의 UploadFile에서 사용, 없으면 서버 시작 시 에러)
    "python-multipart>=0.0.32",
]


#  * ruff를 dependencies(운영용) -> dependency-groups.dev(개발용)로 이동
#  - ruff는 코드 검사 도구라서 실제 서버 실행에는 필요 없음
#  - dev 그룹에 두면 개발 PC에는 설치되지만, 운영 배포 시에는 제외할 수 있음
#    (예: uv sync --no-dev)
#  - 추가 방법: uv add --dev <패키지명>
[dependency-groups]
dev = [
    #  * 테스트용 패키지 3개 추가 (개발 PC에서만 필요하므로 dev 그룹에 추가)
    #  - pytest        : 테스트 코드를 찾아서 실행하고 결과를 알려주는 도구
    #  - pytest-asyncio: async def 로 작성한 비동기 테스트를 실행할 수 있게 해줌
    #  - aiosqlite     : 테스트용 SQLite DB를 비동기로 사용할 수 있게 해줌
    #                    (테스트는 실제 Supabase DB 대신 메모리 속 SQLite DB를 사용)
    "aiosqlite>=0.22.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
]


[tool.ruff]
# 최근에는 모니터 가로 길이가 길어져 100, 120을 많이 선호함
line-length = 100

[tool.ruff.lint]
# 코드를 더 깔끔하게 강제하기 위한 린트 규칙 활성화 (선택 사항)
select = ["E", "F", "I", "UP", "B"]

#  * ruff 파일별 예외 규칙
#  - tests/conftest.py 에서만 E402(import는 파일 맨 위에 있어야 함) 규칙을 끔
#    => conftest.py는 "테스트용 환경 변수를 먼저 설정한 뒤" src를 import 해야 하기 때문
#       (src를 먼저 import 하면 .env의 실제 DB 주소, 실제 비밀키가 먼저 읽혀버림)
[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]


#  * pytest 설정
#  - uv run pytest 실행 시 적용되는 기본 설정
[tool.pytest.ini_options]
# 테스트 코드를 찾을 폴더 (backend/tests)
testpaths = ["tests"]
# backend/ 폴더를 import 기준 위치로 추가 => 테스트 코드에서 from src.main import app 가능
pythonpath = ["."]
# asyncio_mode = "auto": async def 로 작성한 테스트와 fixture를 자동으로 비동기 실행
#  (이 설정이 없으면 비동기 테스트마다 @pytest.mark.asyncio 를 일일이 붙여야 함)
asyncio_mode = "auto"
# fixture가 사용하는 이벤트 루프를 테스트마다 새로 만듦 (테스트끼리 영향을 주지 않도록)
asyncio_default_fixture_loop_scope = "function"
#  * 테스트 결과에 표시하지 않을 경고 설정
#  - 테스트용 메모리 Qdrant에서 나오는 "payload 색인은 효과가 없다"는 경고를 숨김
#    => 메모리 Qdrant는 원래 색인 기능이 없어서 나오는 경고일 뿐, 실제 Qdrant에서는 정상 동작
filterwarnings = [
    "ignore:Payload indexes have no effect in the local Qdrant",
]
