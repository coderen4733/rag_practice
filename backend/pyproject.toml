[project]
name = "backend"
version = "0.1.0"
authors = [
    { name = "CDR4733", email = "shsing2@naver.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "celery[redis]>=5.6.3",
    # [수정] python-jose가 설치해 주던 cryptography를 직접 설치하도록 추가
    #  - src/core/security.py의 Scrypt(비밀번호 해시)가 cryptography를 사용함
    #    ([수정] 파일 위치 변경: 기존 src/common/security.py -> 변경 src/core/security.py)
    #  - 기존에는 python-jose[cryptography]를 통해 "간접적으로" 설치되고 있었기 때문에,
    #    python-jose를 제거하면서 직접 명시하지 않으면 비밀번호 해시 코드가 깨짐
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "greenlet>=3.5.6",  # SQLAlchemy 비동기(async) 기능이 내부적으로 사용하는 라이브러리
    "httpx>=0.28.1",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.5",
    # [수정] pydantic -> pydantic[email]
    #  - 스키마에서 사용하는 EmailStr 타입은 email-validator 패키지가 있어야 동작함
    #  - [email]을 붙이면 email-validator가 함께 설치됨 (없으면 서버 시작 시 ImportError 발생)
    "pydantic[email]>=2.13.5",
    "pydantic-settings>=2.15.0",
    # [수정] python-jose[cryptography] -> pyjwt
    #  - python-jose는 유지보수가 거의 중단되었고 보안 취약점(CVE) 이력이 있음
    #  - FastAPI 공식 문서도 JWT 처리 라이브러리를 PyJWT로 변경함
    "pyjwt>=2.15.0",
    "qdrant-client>=1.19.1",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]


# [수정] ruff를 dependencies(운영용) -> dependency-groups.dev(개발용)로 이동
#  - ruff는 코드 검사 도구라서 실제 서버 실행에는 필요 없음
#  - dev 그룹에 두면 개발 PC에는 설치되지만, 운영 배포 시에는 제외할 수 있음
#    (예: uv sync --no-dev)
#  - 추가 방법: uv add --dev <패키지명>
[dependency-groups]
dev = [
    "ruff>=0.16.9",
]


[tool.ruff]
# 최근에는 모니터 가로 길이가 길어져 100, 120을 많이 선호함
line-length = 100

[tool.ruff.lint]
# 코드를 더 깔끔하게 강제하기 위한 린트 규칙 활성화 (선택 사항)
select = ["E", "F", "I", "UP", "B"]
